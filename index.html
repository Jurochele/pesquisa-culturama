<!DOCTYPE html>
<html lang="pt-pt">
<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <link rel="icon" href="culturama-favico.png">
 <link rel="stylesheet" href="css/style.css">
 <link rel="preconnect" href="https://fonts.googleapis.com">
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
 <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

   <title>Pesquisa Culturama</title>
</head>
<body>
    <main>
<header>
    <img src="img/logo-culturama.png" alt="logo culturama">
    <h1>Pesquisa de Opinião</h1>
</header>
<section>
    <form action="" method="get">

<fieldset>

<legend>Dados Pessoais</legend>
<label for="name">Nome (Obrigatório)</label>
<input id="name" type="text" name="userName" required>
<br>
<label for="age">Idade</label>
<input id="age" type="number" name="userAge" min="12" max="100" required>
<br>
<label for="birthDate">Data de nascimento</label>
<input id="birthDate" type="date" name="userBirthDate">
<br>
<label for="email">Email (Obrigatório)</label>
<input id="email" type="email" name="userEmail" placeholder="ex: myname@example.com" required>
<br>
<label for="phoneNumber">Telefone</label>
<input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{9}" placeholder="número sem espaços ou hífen">
<br>
<label for="image">Upload de foto (Opcional)</label>
<input id="image" type="file" accept="image/*" name="userImage">
<br>
</fieldset>

<fieldset>
<legend>Perfil</legend>

<p>Gênero:</p><br>
<input id="fem" type="radio" name="userGender" value="Feminino">
<label for="fem">Feminino</label>
<input id="masc" type="radio" name="userGender" value="Masculino">
<label for="masc">Masculino</label>
<input id="notInformed" type="radio" name="userGender" value="notInformed">
<label for="notInformed">Prefiro não informar</label>
<br>

<label for="maritalStatus">Estado Civil:</label>
<select id="maritalStatus" name="userMaritalStatus">
<option value="notInformed">Selecione...</option>
<option value="casado">Casado</option>
<option value="solteiro">Solteiro</option>
<option value="divorciado">Divorciado</option>
<option value="uniaoEstavel">União Estável</option>
</select>

<label for="state">Distrito:</label>
<select id="state" name="userState" required>
    <option value="aveiro">Aveiro</option>
    <option value="beja">Beja</option>
    <option value="braga">Braga</option>
    <option value="braganca">Bragança</option>
    <option value="casteloBranco">Castelo Branco</option>
    <option value="coimbra">Coimbra</option>
    <option value="evora">Évora</option>
    <option value="faro">Faro</option>
    <option value="guarda">Guarda</option>
    <option value="leiria">Leiria</option>
    <option value="lisboa">Lisboa</option>
    <option value="portalegre">Portalegre</option>
    <option value="porto">Porto</option>
    <option value="santarem">Santarém</option>
    <option value="setubal">Setúbal</option>
    <option value="vianaDoCastelo">Viana do Castelo</option>
    <option value="vilaReal">Vila Real</option>
    <option value="viseu">Viseu</option>
</select>
<br>

<label for="city">Concelho:</label>
<input id="city" type="text"  name="userCity" autocomplete="address-level2" placeholder="Ex.: Porto" />
</fieldset>

<fieldset>
<legend>Hábitos</legend>
<p>Redes Sociais:</p><br>
<input id="instagram" type="checkbox" name="social" value="instagram">
<label for="instagram">Instagram</label>
<br>
<input id="facebook" type="checkbox" name="social" value="facebook">
<label for="facebook">Facebook</label>
<br>
<input id="linkedin" type="checkbox" name="social" value="linkedIn">
<label for="linkedin">LinkedIn</label>
<br>
<input id="x" type="checkbox" name="social" value="x">
<label for="x">X</label>
<br>
<label for="musicStyle">Estilo Musical:</label>
<input list="styleTypes" id="musicStyle" name="userMusicStyle" type="text">
<datalist id="styleTypes">
    <option value="Rock">
    <option value="Pop">
    <option value="Samba">
    <option value="Sertanejo">
</datalist>
<br>
<label for="favoriteColor">Cor Favorita</label>
<input type="color" name="userFavoriteColor" id="favoriteColor">


</fieldset>

<fieldset>
<legend>Opinião:</legend>
<p>Escala de Satisfação</p><br>
<input type="radio" name="userServiceOpinion" id="otima" value="otima">
<label for="otima">Ótima</label><br>
<input type="radio" name="userServiceOpinion" id="boa" value="boa">
<label for="boa">Boa</label><br>
<input type="radio" name="userServiceOpinion" id="regular" value="regular">
<label for="regular">Regular</label><br>
<input type="radio" name="userServiceOpinion" id="ruim" value="ruim" >
<label for="ruim">Ruim</label><br>

<label for="comment">Escreva sua opinião:</label>
<textarea id="comment" name="userComment" placeholder="Digite aqui sua opinião..."></textarea>


</fieldset>

<fieldset>
<legend>Confirmações:</legend>

<input type="checkbox" name="userGdpr" id="userGdprTerm" value="accepted" required>
<label for="userGdprTerm">Eu aceito participar da pesquisa</label><br>
<input type="checkbox" name="userGetResult" id="getResult" value="accepted">
<label for="userGdprTerm">Desejo receber o resultado por email</label><br>
</fieldset>


<button type="submit">Enviar</button>
<button type="reset">Limpar</button>

 </form>
</section>

    </main>
</body>
</html>
