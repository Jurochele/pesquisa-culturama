<fieldset>
<legend>Perfil</legend>

<p>Gênero:</p>
<input type="radio" name="userGender" value="Feminino">
<label for="userGender">Feminino</label>

<input type="radio" name="userGender" value="Masculino">
<label for="userGender">Masculino</label>

<input type="radio" name="userGender" value="notInformed">
<label for="userGender">Prefiro não informar</label>
<br>

<label for="maritalStatus">Estado Civil:</label>
<select name="maritalStatus">
<option value="notInformed">Selecione...</option>
<option value="casado">Casado</option>
<option value="solteiro">Solteiro</option>
<option value="divorciado">Divorciado</option>
<option value="uniaoEstavel">União Estável</option>
</select>

<label for="userState">Distrito:</label>
<select name="userState" required>
    <option value="aveiro">Aveiro</option>
    <option value="beja">Beja</option>
    <option value="braga">Braga</option>
    <option value="braganca">Bragança</option>
    <option value="casteloBranco">Castelo Branco</option>
    <option value="coimbra">Coimbra</option>
    <option value="evora">Évora</option>
    <option value="faro">Faro</option>
    <option value="guarda">Guarda</option>
    <option value="leiria">Leiria</option>
    <option value="lisboa">Lisboa</option>
    <option value="portalegre">Portalegre</option>
    <option value="porto">Porto</option>
    <option value="santarem">Santarém</option>
    <option value="setubal">Setúbal</option>
    <option value="vianaDoCastelo">Viana do Castelo</option>
    <option value="vilaReal">Vila Real</option>
    <option value="viseu">Viseu</option>
</select>

<label for="userCity">Concelho:</label>
<input type="text" id="userCity" name="userCity" autocomplete="address-level2" placeholder="Ex.: Porto" />



</fieldset>



<button type="submit">Enviar</button>
